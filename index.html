<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeShoot Arena // Cyber Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070c;
            --panel-bg: rgba(12, 17, 28, 0.85);
            --neon-cyan: #00f3ff;
            --neon-red: #ff0055;
            --neon-yellow: #fcee0a;
            --text-main: #ffffff;
            --text-muted: #7d8fba;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.07) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem;
            overflow: hidden;
            user-select: none;
        }

        .screen-container {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 4px); }
            40% { transform: translate(4px, -3px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(2px, 3px); }
            100% { transform: translate(0, 0); }
        }

        .shake { animation: screenShake 0.2s ease-in-out; }

        /* Top HUD */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 1.5px;
        }
        .logo span { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.6); }

        .hud-stats {
            display: flex;
            gap: 2.5rem;
            font-family: 'Orbitron', sans-serif;
        }

        .stat-group { display: flex; flex-direction: column; align-items: flex-end; }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-size: 1.15rem; font-weight: 700; color: var(--neon-cyan); }
        #lives-val { color: var(--neon-red); text-shadow: 0 0 10px rgba(255,0,85,0.5); }

        /* Combat Arena */
        .arena {
            width: 100%;
            flex-grow: 1;
            position: relative;
            background: rgba(8, 12, 20, 0.75);
            margin: 0.8rem 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        /* Enemy Drones */
        .drone {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            background: rgba(14, 20, 34, 0.95);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
            transition: top 0.03s linear, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .drone.locked {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transform: scale(1.08);
            z-index: 10;
        }

        .drone .typed { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.8); }
        .drone .leftover { color: var(--text-main); }

        /* Player Cannon / Crosshair at bottom */
        .cannon-base {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: var(--neon-cyan);
            border-radius: 4px 4px 0 0;
            box-shadow: 0 0 15px var(--neon-cyan);
            z-index: 5;
        }

        /* Laser Bullet Animation */
        .laser-bullet {
            position: absolute;
            width: 4px;
            height: 25px;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
            border-radius: 2px;
            pointer-events: none;
            z-index: 8;
            transition: all 0.08s linear;
        }

        /* Explosion Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--neon-yellow);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px var(--neon-yellow);
            animation: explodeOut 0.4s ease-out forwards;
            z-index: 15;
        }

        @keyframes explodeOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        /* Danger Line */
        .danger-line {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 3px;
            background: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }

        /* Input Console */
        .console-box { width: 100%; position: relative; }
        #type-input {
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 243, 255, 0.25);
            padding: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: var(--neon-cyan);
            border-radius: 12px;
            outline: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: all 0.2s;
        }
        #type-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0,243,255,0.3);
        }

        /* Poki-Style Modal Menu */
        #menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-card {
            background: linear-gradient(145deg, #0e1422, #080b13);
            padding: 2.8rem 2.4rem;
            border-radius: 20px;
            text-align: center;
            width: 460px;
            border: 1px solid rgba(0,243,255,0.25);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(0,243,255,0.1);
        }

        .menu-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0,243,255,0.4));
        }

        .menu-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.8rem; line-height: 1.5; }
        
        .score-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
            display: none;
        }

        .score-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 1rem;
            border-radius: 10px;
        }
        .score-box .s-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.3rem; }
        .score-box .s-value { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--neon-yellow); }

        .btn-play {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), #0077ff);
            color: #05070c;
            border: none;
            padding: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0,243,255,0.5);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-play:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0,243,255,0.8); }
    </style>
</head>
<body>

    <div class="screen-container" id="container">
        <header>
            <div class="logo">TYPESHOOT // <span>ARCADE</span></div>
            <div class="hud-stats">
                <div class="stat-group">
                    <span class="stat-label">Score</span>
                    <span class="stat-val" id="score-disp">0</span>
                </div>
                <div class="stat-group">
                    <span class="stat-label">Combo</span>
                    <span class="stat-val" id="combo-disp">1x</span>
                </div>
                <div class="stat-group">
                    <span class="stat-label">Shields</span>
                    <span class="stat-val" id="lives-disp">♥♥♥</span>
                </div>
            </div>
        </header>

        <div class="arena" id="arena">
            <div class="danger-line"></div>
            <div class="cannon-base" id="cannon"></div>
        </div>

        <div class="console-box">
            <input type="text" id="type-input" placeholder="TYPE TO TARGET & SHOOT..." autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <!-- Menu / Game Over Modal -->
    <div id="menu-overlay">
        <div class="menu-card">
            <h1 id="menu-title">TYPESHOOT ARCADE</h1>
            <p id="menu-desc">Type enemy drone codes to lock your weapon cannon, fire laser beams, and destroy targets before they breach core defenses!</p>
            
            <div class="score-board" id="score-board">
                <div class="score-box">
                    <div class="s-title">Final Score</div>
                    <div class="s-value" id="final-score">0</div>
                </div>
                <div class="score-box">
                    <div class="s-title">High Score</div>
                    <div class="s-value" id="high-score">0</div>
                </div>
            </div>

            <button class="btn-play" id="play-btn">START MISSION</button>
        </div>
    </div>

    <script>
        const wordPool = [
            "laser", "plasma", "pulse", "orbit", "vector", "matrix", "shield", 
            "target", "strike", "cannon", "photon", "quantum", "binary", "syntax", 
            "packet", "router", "daemon", "proxy", "firewall", "kernel", "buffer"
        ];

        let score = 0;
        let combo = 1;
        let lives = 3;
        let gameRunning = false;
        let drones = [];
        let lockedDrone = null;
        let spawnInterval = null;
        let loopInterval = null;

        const arena = document.getElementById('arena');
        const inputField = document.getElementById('type-input');
        const scoreDisp = document.getElementById('score-disp');
        const comboDisp = document.getElementById('combo-disp');
        const livesDisp = document.getElementById('lives-disp');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const scoreBoard = document.getElementById('score-board');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score');
        const playBtn = document.getElementById('play-btn');
        const container = document.getElementById('container');
        const cannon = document.getElementById('cannon');

        // Synthesized sound effects via Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (type === 'shoot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                } else if (type === 'destroy') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                }
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function triggerScreenShake() {
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 200);
        }

        function startGame() {
            // Cleanup existing drones
            document.querySelectorAll('.drone, .laser-bullet, .particle').forEach(el => el.remove());
            drones = [];
            lockedDrone = null;
            score = 0;
            combo = 1;
            lives = 3;
            gameRunning = true;

            menuOverlay.style.display = 'none';
            inputField.value = '';
            inputField.focus();

            updateHUD();

            spawnInterval = setInterval(spawnDrone, 1800);
            loopInterval = setInterval(gameLoop, 30);
        }

        function spawnDrone() {
            if (!gameRunning) return;

            const text = wordPool[Math.floor(Math.random() * wordPool.length)];
            if (drones.some(d => d.text === text)) return;

            const el = document.createElement('div');
            el.className = 'drone';
            el.innerHTML = `<span class="leftover">${text}</span>`;

            const maxLeft = arena.clientWidth - 130;
            const leftPos = Math.max(15, Math.floor(Math.random() * maxLeft));
            el.style.left = leftPos + 'px';
            el.style.top = '0px';

            arena.appendChild(el);

            drones.push({
                text: text,
                typedLen: 0,
                element: el,
                top: 0,
                speed: 0.9 + (score / 450)
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            for (let i = drones.length - 1; i >= 0; i--) {
                let d = drones[i];
                d.top += d.speed;
                d.element.style.top = d.top + 'px';

                // Check breach line at bottom
                if (d.top >= arena.clientHeight - 45) {
                    breachDefense(i);
                }
            }
        }

        function breachDefense(index) {
            let d = drones[index];
            if (d.element.parentNode) d.element.remove();
            if (lockedDrone === d) lockedDrone = null;
            drones.splice(index, 1);

            lives--;
            combo = 1;
            playSfx('hit');
            triggerScreenShake();
            updateHUD();

            if (lives <= 0) {
                gameOver();
            }
        }

        function fireLaserBullet(targetEl) {
            playSfx('shoot');
            const bullet = document.createElement('div');
            bullet.className = 'laser-bullet';
            
            const cannonRect = cannon.getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            const targetRect = targetEl.getBoundingClientRect();

            const startX = cannonRect.left - arenaRect.left + (cannonRect.width / 2);
            const startY = cannonRect.top - arenaRect.top;
            const targetX = targetRect.left - arenaRect.left + (targetRect.width / 2);
            const targetY = targetRect.top - arenaRect.top + (targetRect.height / 2);

            bullet.style.left = startX + 'px';
            bullet.style.top = startY + 'px';
            arena.appendChild(bullet);

            // Animate laser towards target drone
            requestAnimationFrame(() => {
                bullet.style.left = targetX + 'px';
                bullet.style.top = targetY + 'px';
            });

            setTimeout(() => bullet.remove(), 80);
        }

        function createExplosion(x, y) {
            playSfx('destroy');
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 50;
                p.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                arena.appendChild(p);
                setTimeout(() => p.remove(), 400);
            }
        }

        function updateHUD() {
            scoreDisp.innerText = score;
            comboDisp.innerText = combo + 'x';
            livesDisp.innerText = '♥'.repeat(Math.max(0, lives));
        }

        // Core Typing Weapon Mechanics
        inputField.addEventListener('input', () => {
            if (!gameRunning) return;
            const val = inputField.value.trim().toLowerCase();

            if (!lockedDrone) {
                // Lock weapon onto drone matching typed character
                lockedDrone = drones.find(d => d.text.toLowerCase().startsWith(val));
                if (lockedDrone) {
                    lockedDrone.element.classList.add('locked');
                }
            }

            if (lockedDrone) {
                if (lockedDrone.text.toLowerCase().startsWith(val)) {
                    lockedDrone.typedLen = val.length;
                    
                    const typedPart = lockedDrone.text.substring(0, val.length);
                    const leftPart = lockedDrone.text.substring(val.length);
                    lockedDrone.element.innerHTML = `<span class="typed">${typedPart}</span><span class="leftover">${leftPart}</span>`;

                    fireLaserBullet(lockedDrone.element);

                    // Fully typed and destroyed!
                    if (val === lockedDrone.text.toLowerCase()) {
                        const rect = lockedDrone.element.getBoundingClientRect();
                        const arenaRect = arena.getBoundingClientRect();
                        createExplosion(rect.left - arenaRect.left + (rect.width/2), rect.top - arenaRect.top + (rect.height/2));

                        score += 15 * combo;
                        combo++;
                        inputField.value = '';

                        const idx = drones.indexOf(lockedDrone);
                        if (idx !== -1) {
                            if (lockedDrone.element.parentNode) lockedDrone.element.remove();
                            drones.splice(idx, 1);
                        }
                        lockedDrone = null;
                        updateHUD();
                    }
                } else {
                    // Typo! Reset weapon lock
                    if (lockedDrone) lockedDrone.element.classList.remove('locked');
                    lockedDrone = null;
                    inputField.value = '';
                    combo = 1;
                    updateHUD();
                }
            } else {
                inputField.value = '';
            }
        });

        function gameOver() {
            gameRunning = false;
            clearInterval(spawnInterval);
            clearInterval(loopInterval);

            const best = parseInt(localStorage.getItem('typeshoot_highscore')) || 0;
            if (score > best) {
                localStorage.setItem('typeshoot_highscore', score);
            }

            menuTitle.innerText = "MISSION FAILED";
            menuDesc.innerText = "Defense grid overrun by incoming enemy drone units.";
            finalScoreEl.innerText = score;
            highScoreEl.innerText = Math.max(score, best);
            scoreBoard.style.display = 'grid';
            playBtn.innerText = "RE-ENGAGE MISSION";
            menuOverlay.style.display = 'flex';
        }

        playBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
